<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mes Recettes</title>
<link href="https://fonts.googleapis.com/css2?family=Proxima+Nova:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'Proxima Nova',system-ui,sans-serif; padding:10px; background:#e8f5e9; margin:0; }
header { background:#4caf50; color:white; text-align:center; padding:1rem; font-size:1.5rem; font-weight:600; border-radius:0 0 10px 10px; }
main { padding:1rem; }
.recipe { background:white; padding:10px; margin-bottom:10px; border-radius:10px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
.category { font-size:12px; color:#388e3c; text-transform:uppercase; display:block; margin-bottom:5px; font-weight:600; }
form input, form select, form button, form textarea { width:100%; padding:10px; margin-bottom:10px; border-radius:5px; border:1px solid #c8e6c9; box-sizing:border-box; }
form button { background:#66bb6a; color:white; border:none; }
button { cursor:pointer; }
.error,.ok{padding:.5rem;border-radius:6px;display:none;margin:5px 0;}
.error{background:#ffdddd}.ok{background:#ddffdd}
</style>
</head>
<body>
<header>Mes Recettes 🌿</header>
<main>
<button id="refreshBtn">🔄 Rafraîchir</button> <span id="count"></span>
<div id="errorBox" class="error"></div>
<div id="okBox" class="ok"></div>
<form id="recipeForm">
<input type="text" id="title" placeholder="Nom de la recette" required />
<input type="url" id="url" placeholder="Lien de la recette (optionnel)" />
<textarea id="markdown_content" rows="10" placeholder="Recette Markdown (optionnel)"></textarea>
<select id="category" required>
<option value="">Choisir une catégorie</option><option value="entree">Entrée</option><option value="plat">Plat</option><option value="dessert">Dessert</option>
</select>
<label><input type="checkbox" id="vegan" /> 🌿 Végétale</label>
<button type="submit">Ajouter la recette</button>
</form>
<select id="filterCategory"><option value="all">Toutes</option><option value="entree">Entrée</option><option value="plat">Plat</option><option value="dessert">Dessert</option></select>
<label><input type="checkbox" id="filterVegan" /> Afficher seulement 🌿 Végétales</label>
<div id="recipesContainer"></div>
<div id="recipeModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)"><div style="background:#fff;width:min(900px,90%);margin:30px auto;padding:20px;border-radius:10px;max-height:85vh;overflow:auto"><button onclick="closeRecipeModal()">Fermer</button><div id="recipeContent"></div></div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const SUPABASE_URL='https://yztzhfwzscskusiccpov.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_Sd0Ut3CDYKr4g8FhMKcHcg_BrRaTBfY';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const container=document.getElementById('recipesContainer');
const form=document.getElementById('recipeForm');
const recipes=[];let editingId=null;
async function loadRecipes(){const {data}=await supabase.from('Recettes').select('id,title,url,markdown_content,category,vegan').order('title');window.recipes=data||[];renderRecipes();}
function renderRecipes(){container.innerHTML='';for(const r of window.recipes){const d=document.createElement('div');d.className='recipe';d.innerHTML=`<h2>${r.title} ${r.vegan?'🌿':''}</h2><span class="category">${r.category}</span><button class="view">${r.markdown_content?'📖 Lire la recette':'🔗 Ouvrir le lien'}</button> <button class="edit">Modifier</button> <button class="delete">Supprimer</button>`;d.querySelector('.view').onclick=()=>showRecipe(r.id);container.appendChild(d);}}
window.closeRecipeModal=()=>document.getElementById('recipeModal').style.display='none';
function markdownToHtml(md=''){return md.replace(/^### (.*)$/gim,'<h3>$1</h3>').replace(/^## (.*)$/gim,'<h2>$1</h2>').replace(/^# (.*)$/gim,'<h1>$1</h1>').replace(/^- (.*)$/gim,'<li>$1</li>').replace(/
/g,'<br>');}
window.showRecipe=function(id){const r=window.recipes.find(x=>x.id===id);console.log(r);if(!r)return;if(r.markdown_content&&r.markdown_content.trim()){document.getElementById('recipeContent').innerHTML=markdownToHtml(r.markdown_content);document.getElementById('recipeModal').style.display='block';return;}if(r.url)window.open(r.url,'_blank','noopener,noreferrer');};
form.addEventListener('submit',async e=>{e.preventDefault();const title=title.value?.trim();const url=document.getElementById('url').value.trim();const markdown_content=document.getElementById('markdown_content').value.trim();const category=document.getElementById('category').value;const vegan=document.getElementById('vegan').checked;if(!url&&!markdown_content)return;const data={title,url,markdown_content,category,vegan};if(editingId) await supabase.from('Recettes').update(data).eq('id',editingId); else await supabase.from('Recettes').insert(data);loadRecipes();});
loadRecipes();
</script></main></body></html>
